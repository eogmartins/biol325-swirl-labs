- Class: meta
  Course: Introduction to R
  Lesson: Workspace and Files
  Author: David Kane (modified by Eduardo Martins)
  Type: Standard
  Organization: Williams College
  Version: 0.1.2

- Class: text
  Output: In this lesson, you'll learn how to examine your local workspace in R 
    and begin to explore the relationship between your workspace and the file 
    system of your machine.

- Class: text
  Output: Because different operating systems have different conventions with 
   regards to things like file paths, the outputs of these commands may vary 
   across machines.

- Class: text
  Output: However it's important to note that R provides a common API (a common
    set of commands) for interacting with files, that way your code will work
    across different kinds of computers.

- Class: text
  Output: Let's jump right in so you can get a feel for how these special 
    functions work!

- Class: text
  Output: In R, the working directory is the default folder on your computer 
    where R looks for files (e.g., data to read in) and saves files (e.g., 
    outputs, plots).

- Class: cmd_question
  Output: Determine which directory your R session is using as its current 
    working directory using getwd().
  CorrectAnswer: getwd()
  AnswerTests: omnitest(correctExpr='getwd()')
  Hint: Type getwd() to determine the current working directory.

- Class: cmd_question
  Output: List all the R objects in your local workspace using ls().
  CorrectAnswer: ls()
  AnswerTests: omnitest(correctExpr='ls()')
  Hint: Type ls() to view all the objects in your local workspace.

- Class: text
  Output: You may see R list objects you created in a previous lesson (e.g., x, y, 
    my_div etc). If for some reason those objects were removed and you don't have
    any objects in your workspace, you will see the output character(0).

- Class: cmd_question
  Output: Assign 9 to w using w <- 9.
  CorrectAnswer: w <- 9
  AnswerTests: omnitest(correctExpr='w <- 9')
  Hint: Type w <- 9 to assign 9 to w.

- Class: cmd_question
  Output: Now take a look at objects that are in your workspace using ls() and
    you should see w added to it.
  CorrectAnswer: ls()
  AnswerTests: omnitest(correctExpr='ls()')
  Hint: Type ls() to view all the objects in your workspace.

- Class: cmd_question
  Output: List all the files in your working directory using list.files() or 
    dir().
  CorrectAnswer: list.files()
  AnswerTests: any_of_exprs('list.files()', 'dir()')
  Hint: Type list.files() od dir() to see all the files in your working directory.

- Class: cmd_question
  Output: As we go through this lesson, you should be examining the help page 
    for each new function. Check out the help page for list.files with the
    command ?list.files and dir with ?dir.
  CorrectAnswer: ?list.files
  AnswerTests: any_of_exprs('?list.files', '?dir', 'help("list.files")', 'help("dir")')
  Hint: Type ?list.files or ?dir to see the help page.

- Class: text
  Output: When opening a help file, make sure to check out the sections 
    Description (a brief blurb on what the function does), Usage (showing all
    the arguments you can use with the function and their default values),
    Arguments (a detailed explanation of all function arguments), and Examples 
    (illustrating various uses of the function, which you can copy and paste in
    R to see their output or simply click Run examples).

- Class: text
  Output: Using the args() function on a function name is also a handy way to 
    see what arguments a function can take. 


- Class: cmd_question
  Output: Use the args() function to determine the arguments to list.files().
  CorrectAnswer: args(list.files)
  AnswerTests: omnitest(correctExpr='args(list.files)')
  Hint: Type args(list.files) to see the arguments to list.files.


- Class: cmd_question
  Output: Assign the value of the current working directory to a variable 
    called "old_dir".
  CorrectAnswer: old_dir <- getwd()
  AnswerTests: omnitest(correctExpr='old_dir <- getwd()')
  Hint: Type old_dir <- getwd() to assign the value of the current working 
    directory to a variable called "old_dir".

- Class: text
  Output: We will use old_dir at the end of this lesson to move back to the 
    place that we started. A lot of query functions like getwd() have the 
    useful property that they return the answer to the question as a result of 
    the function.

- Class: cmd_question
  Output: Use dir.create() to create a directory in the current working 
    directory called "testdir". As you set the working directory, you do 
    not need to write the full path where this new subdirectory is to be created.
    Just write the name of the new directory (between quotation marks) and R will
    interpret that you want it placed under the working directory (keep in mind 
    that in R all file and directory paths are relative to the working directory)
  CorrectAnswer: dir.create("testdir")
  AnswerTests: omnitest(correctExpr='dir.create("testdir")')
  Hint: Type dir.create("testdir") to create a directory in the current working 
    directory called "testdir".

- Class: text
  Output: We will do all our work in this new directory and then delete it after
    we are done. This is the R analog to "Take only pictures, leave only footprints".

- Class: cmd_question
  Output: Set your working directory to "testdir" with the setwd() command.
  CorrectAnswer: setwd("testdir")
  AnswerTests: any_of_exprs('setwd("testdir")', 'setwd("testdir/")')
  Hint: Use setwd("testdir") to set your working directory to "testdir".

- Class: text
  Output: In general, you will want your working directory to be someplace 
    sensible, perhaps created for the specific project that you are working on. 
    In fact, organizing your work using RStudio Projects is an excellent 
    option and will cover that later in the course
    
- Class: cmd_question
  Output: Create a file in your new working directory called "mytest.R" using the
    file.create() function.
  CorrectAnswer: file.create("mytest.R")
  AnswerTests: omnitest(correctExpr='file.create("mytest.R")')
  Hint: file.create("mytest.R") will get the job done!

- Class: cmd_question
  Output: This should be the only file in this newly created directory. Let's
    check this by listing all the files in the current directory.
  CorrectAnswer: list.files()
  AnswerTests: any_of_exprs('list.files()', 'dir()')
  Hint: list.files() shows that the directory only contains mytest.R.

- Class: text
  Output: Your operating system and RStudio will provide simpler tools for these sorts 
    of file management tasks, but having the ability to manipulate files 
    programatically is useful and R has many functions for that (e.g., file.exists, 
    file.rename, file.remove, file copy). We won't go over them, as we won't use
    them in the course. But you should know they exist, as they will certainly
    be useful if you find yourself having to manage large numbers of data files
    in your job as an applied ecologist (or other data analysis career). They can
    save you a lot of time by avoiding having you do all these file management tasks
    by hand!

- Class: cmd_question
  Output: Go back to your original working directory using setwd(). (Recall that we 
    created the variable old_dir with the full path for the orginal working 
    directory at the start of these questions.)
  CorrectAnswer: setwd(old_dir)
  AnswerTests: omnitest(correctExpr='setwd(old_dir)')
  Hint: Use setwd(old_dir).

- Class: text
  Output: Lesson completed! Here, you learned how to examine your R workspace 
    and the basics of working with the file system of your machine from within 
    R. Next, you will learn about creating sequences of numbers.
  
