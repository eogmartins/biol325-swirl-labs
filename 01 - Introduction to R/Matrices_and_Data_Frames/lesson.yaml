- Class: meta
  Course: Introduction to R
  Lesson: Matrices and Data Frames
  Author: Nick Carchedi (modified by Eduardo Martins)
  Type: Standard
  Organization: JHU Biostat
  Version: 2.2.0

- Class: text
  Output: In this lesson, we'll cover matrices and data frames. Both 
    represent 'rectangular' data types, meaning that they are used to store 
    tabular data (or data in table format), with rows and columns.

- Class: text
  Output: The main difference, as you'll see, is that matrices can only contain 
    a single class of data (e.g., numeric, logic, etc), while data frames can 
    consist of many different classes of data (data classes can be different 
    across columns).

- Class: cmd_question
  Output: Let's create a vector containing the numbers 1 through 20 using 
    the `:` operator. Store the result in a variable called my_vector.
  CorrectAnswer: my_vector <- 1:20
  AnswerTests: omnitest(correctExpr='my_vector <- 1:20')
  Hint: You learned about the `:` operator in the lesson on sequences. If you 
    wanted to create a vector containing the numbers 1, 2, and 3 (in that order),
    you could use either c(1, 2, 3) or 1:3. In this case, we want the numbers 1 
    through 20 stored in a variable called my_vector. Also, remember that you 
    don't need the c() function when using `:`.

- Class: cmd_question
  Output: View the contents of the vector you just created.
  CorrectAnswer: my_vector
  AnswerTests: omnitest(correctExpr='my_vector')
  Hint: Type my_vector to view its contents.

- Class: cmd_question
  Output: The dim() function tells us the 'dimensions' of an object. What 
    happens if we do dim(my_vector)? Give it a try.
  CorrectAnswer: dim(my_vector)
  AnswerTests: omnitest(correctExpr='dim(my_vector)')
  Hint: Just type dim(my_vector) to see what happens.

- Class: cmd_question
  Output: Clearly, that's not very helpful! Since my_vector is a vector, it 
    doesn't have a `dim` attribute (so it's just NULL), but we can find its 
    length using the length() function. Try that now.
  CorrectAnswer: length(my_vector)
  AnswerTests: omnitest(correctExpr='length(my_vector)')
  Hint: Type length(my_vector) to view the length of the vector you just created.

- Class: cmd_question
  Output: Ah! That's what we wanted. But, what happens if we give 
    my_vector a `dim` attribute? Let's give it a try. Type dim(my_vector) <- c(4, 5).
  CorrectAnswer: dim(my_vector) <- c(4, 5)
  AnswerTests: omnitest(correctExpr='dim(my_vector) <- c(4, 5)')
  Hint: Type dim(my_vector) <- c(4, 5) to give my_vector a `dim` attribute.

- Class: text
  Output: It's okay if that last command seemed a little strange to you. It 
    should! The dim() function allows you to get OR set the `dim` attribute for 
    an R object. In this case, we assigned the value c(4, 5) to the `dim` 
    attribute of my_vector.

- Class: cmd_question
  Output: Use dim(my_vector) to confirm that we've set the `dim` attribute 
    correctly.
  CorrectAnswer: dim(my_vector)
  AnswerTests: omnitest(correctExpr='dim(my_vector)')
  Hint: Just type dim(my_vector) to make sure the `dim` attribute has been set.

- Class: cmd_question
  Output: Another way to see this is by calling the attributes() function on 
    my_vector. Try it now.
  CorrectAnswer: attributes(my_vector)
  AnswerTests: omnitest(correctExpr='attributes(my_vector)')
  Hint: The command attributes(my_vector) will show you all of the attributes 
    for the my_vector object.

- Class: text
  Output: Just like in math class, when dealing with a 2-dimensional object 
    (think rectangular table), the first number is the number of rows and the 
    second is the number of columns. Therefore, we just gave my_vector 4 rows 
    and 5 columns.

- Class: cmd_question
  Output: But, wait! That doesn't sound like a vector any more. Well, it's not. 
    Now it's a matrix. View the contents of my_vector now to see what it looks 
    like.
  CorrectAnswer: my_vector
  AnswerTests: omnitest(correctExpr='my_vector')
  Hint: Type my_vector to view its contents.

- Class: cmd_question
  Output: Now, let's confirm it's actually a matrix by using the class() function. 
    Type class(my_vector) to see what I mean.
  CorrectAnswer: class(my_vector)
  AnswerTests: omnitest(correctExpr='class(my_vector)')
  Hint: Type class(my_vector) to view the class of my_vector.

- Class: text
  Output: Sure enough, my_vector is now a matrix. You will see that R says 
    my_vector is also an array. That's because a matrix is a special type of array 
    that has only two dimensions, whereas arrays can have any number of dimensions.
    But don't worry about this additional complexity. While arrays are useful in
    the advanced analysis of more complex ecological data sets, we won't be 
    using arrays in this course!

- Class: cmd_question
  Output: As my_vector is a matrix, we should store my_vector it in a new 
    variable that helps us remember what it is. Store the value of my_vector in 
    a new variable called my_matrix.
  CorrectAnswer: my_matrix <- my_vector
  AnswerTests: omnitest(correctExpr='my_matrix <- my_vector')
  Hint: Since we can't just change the name of our my_vector variable, we'll 
    assign its value to a new variable with my_matrix <- my_vector.

- Class: text
  Output: The example that we've used so far was meant to illustrate the point 
    that a matrix is simply a vector with a dimension attribute. A more direct 
    method of creating the same matrix uses the matrix() function.

- Class: cmd_question
  Output: Bring up the help file for the matrix() function now using the `?` function.
  CorrectAnswer: ?matrix
  AnswerTests: omnitest(correctExpr='?matrix')
  Hint: The command ?matrix will do the trick.

- Class: cmd_question
  Output: Now, look at the documentation for the matrix function and see if you 
    can figure out how to create a matrix containing the same numbers (1-20) and 
    dimensions (4 rows, 5 columns) by calling the matrix() function. Store the 
    result in a variable called my_matrix2.
  CorrectAnswer: my_matrix2 <- matrix(1:20, nrow = 4, ncol = 5)
  AnswerTests: calculates_same_value('matrix(1:20, nrow = 4, ncol = 5)'); expr_creates_var('my_matrix2')
  Hint: Call the matrix() function with three arguments -- 1:20, the number of 
    rows, and the number of columns. Be sure to specify arguments by their 
    proper names and store the result in my_matrix2 (not in my_matrix).

- Class: cmd_question
  Output: Finally, let's confirm that my_matrix and my_matrix2 are actually 
    identical. The identical() function will tell us if its first two arguments 
    are the same. Try it out.
  CorrectAnswer: identical(my_matrix, my_matrix2)
  AnswerTests: any_of_exprs('identical(my_matrix, my_matrix2)', 'identical(my_matrix2, my_matrix)')
  Hint: If you're not sure about this one, then checkout the documentation for 
    identical() using the `?` function.

- Class: text
  Output: Now, imagine that the numbers in our table represent some measurements
    from an ecological experiment, where each row represents one plant and each 
    column represents one variable for which measurements were taken.

- Class: text
  Output: We may want to label the rows, so that we know which numbers belong to 
    each plant in the experiment. One way to do this is to add a column to the 
    matrix, which contains an ID for all four plants.

- Class: cmd_question
  Output: Let's start by creating a character vector containing the IDs of our plants
    -- P1, P2, P3, and P4. Remember that double quotes tell R that something is 
    a character string. Store the result in a variable called plants.
  CorrectAnswer: plants <- c("P1", "P2", "P3", "P4")
  AnswerTests: omnitest(correctExpr='plants <- c("P1", "P2", "P3", "P4")')
  Hint: Make sure to capitalize the first letter of each name and to store the 
    result in a variable called plants. Also, don't get the order of the plants
    mixed up! That would be a disaster!

- Class: cmd_question
  Output: Now we'll use the cbind() function to 'combine columns'. Don't worry 
    about storing the result in a new variable. Just call cbind() with two 
    arguments -- the plants vector and my_matrix.
  CorrectAnswer: cbind(plants, my_matrix)
  AnswerTests: omnitest(correctExpr='cbind(plants, my_matrix)')
  Hint: Type cbind(plants, my_matrix) to add the IDs of our plants to the matrix
    of numbers.

- Class: text
  Output: Something is fishy about our result! It appears that combining the 
    character vector with our matrix of numbers caused everything to be 
    enclosed in double quotes. This means we're left with a matrix of character 
    strings, which is no good.

- Class: text
  Output: If you remember back to the beginning of this lesson, I told you that 
    matrices can only contain ONE class of data. Therefore, when we tried to 
    combine a character vector (as a new columns to the matrix) with a numeric 
    matrix, R was forced to 'coerce' the numbers to characters, hence the double 
    quotes.

- Class: text
  Output: This is called 'implicit coercion', because we didn't ask for it. It 
    just happened. But why didn't R just convert the IDs of our plants to 
    numbers? I'll let you ponder that question on your own.

- Class: cmd_question
  Output: So, we're still left with the question of how to include the IDs of 
    our plants in the table without destroying the integrity of our numeric data. 
    Try the following -- my_data <- data.frame(plants, my_matrix)
  CorrectAnswer: my_data <- data.frame(plants, my_matrix)
  AnswerTests: omnitest(correctExpr='my_data <- data.frame(plants, my_matrix)')
  Hint: Type my_data <- data.frame(plants, my_matrix), so we can explore what 
    happens.

- Class: cmd_question
  Output: Now view the contents of my_data to see what we've come up with.
  CorrectAnswer: my_data
  AnswerTests: omnitest(correctExpr='my_data')
  Hint: Type my_data to view its contents.

- Class: text
  Output: It looks like the data.frame() function allowed us to store our 
    character vector of IDs right alongside our matrix of numbers. That's 
    exactly what we were hoping for! 

- Class: text
  Output: Behind the scenes, the data.frame() function takes any number of 
    arguments and returns a single object of class `data.frame` that is composed 
    of the original objects.

- Class: cmd_question
  Output: Let's confirm this by calling the class() function on our newly 
    created data frame.
  CorrectAnswer: class(my_data)
  AnswerTests: omnitest(correctExpr='class(my_data)')
  Hint: The class function takes one argument -- the object of which you want 
    to determine the class.

- Class: text
  Output: It's also possible to assign names to the individual rows and columns 
    of a data frame, which presents another possible way of determining which 
    row of values in our table belongs to each plant.

- Class: text
  Output: However, since we've already solved that problem, let's solve a 
    different problem by assigning names to the columns of our data frame so 
    that we know what type of measurement each column represents.

- Class: cmd_question
  Output: Since we have six columns (including plant IDs), we'll need to first 
    create a vector containing one element for each column. Create a character 
    vector called cnames that contains the following values 
    (in order) -- plant, age, height, dbh, dose, response. Remember that double 
    quotes tell R that something is a character string.
  CorrectAnswer: cnames <- c("plant", "age", "height", "dbh", "dose", "response")
  AnswerTests: omnitest(correctExpr='cnames <- c("plant", "age", "height", "dbh", "dose", "response")')
  Hint: Make sure all of the names are lowercase, surrounded by double quotes, 
    and separated with commas. Don't forget to use the c() function.

- Class: cmd_question
  Output: Now, use the colnames() function to set the `colnames` attribute for 
    our data frame. This is similar to the way we used the dim() function 
    earlier in this lesson.
  CorrectAnswer: colnames(my_data) <- cnames
  AnswerTests: omnitest(correctExpr='colnames(my_data) <- cnames')
  Hint: Try colnames(my_data) <- cnames.

- Class: cmd_question
  Output: Let's see if that got the job done. Print the contents of my_data.
  CorrectAnswer: my_data
  AnswerTests: omnitest(correctExpr='my_data')
  Hint: Print the contents of my_data to the console.

- Class: text
  Output: "Lesson completed. Here, you learned the basics of working with two 
    very important and common data structures: matrices and data frames. It's 
    important that you understand the difference between these two data structures,
    but in this course we will be working primarily with data frames. In future
    labs, you will see other ways to create data frames and learn how to wrangle
    them. Next, we will learn how to look at our data in R!"
